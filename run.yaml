apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/aneeqkha/juphc-tc_pipeline.git
    - name: branch
      value: main
    - name: image-url
      value: us.icr.io/sn-labs-aneeqkhan110/tax-calculator:pipeline
  workspaces:
    - name: output
      persistentVolumeClaim:
        claimName: tax-calculator-pvc
